# Address the server will listen on
bind = "[::]:8080"

# Whether to allow connections to Navidrome instances without a valid SSL certificate
allow_invalid_certs = false

# By default, the user can specify a custom URL to connect to any Navidrome instance.
# Setting this value only allows Navalyze to connect to a single Navidrome instance.
# Unless you're hosting Navalyze for multiple people with different Navidrome instances, you should set this
# navidrome_url = "http://localhost:4533"

# This is the API for the "make a wrapped" tool created by DevMatei (https://github.com/DevMatei/make-a-wrapped)
# If you choose to self host this service, you can change the URL here. If you want it disabled, just comment this out
make_a_wrapped_url = "https://wrapped.devmatei.com/api/v1"

# How long to wait before checking if new scrobbles are available (In seconds)
scrobble_update_interval = 30

# Your ListenBrainz token. Used to fetch additional info about your library
# Note this is experimental and can make Navalyze unstable
# lbz_token = ""

# This determines the folder containing the files for Navalyze's website. This setting is ignored while running docker
dist_dir = "./dist"
