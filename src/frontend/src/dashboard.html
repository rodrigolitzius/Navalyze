<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="module" src="js/dashboard.js" defer></script>
    <script type="module" src="js/load-sidebar.js" defer></script>
</head>
<body>
    <div id="layout">
        <main>
            <header id="top-bar">
                <h1>Dashboard</h1>
                <div id="top-bar-controls">
                    <label class="selector-button" id="timezone-control" for="timezone-select">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3.7 12h16.6M12 3.7c2.4 2.3 3.7 5.3 3.7 8.3s-1.3 6-3.7 8.3c-2.4-2.3-3.7-5.3-3.7-8.3S9.6 6 12 3.7Z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
                        <select id="timezone-select" aria-label="Fuso horário"></select>
                    </label>
                </div>
            </header>

            <section class="card">
                <h2 class="card-name">Your statistics</h2>

                <div id="stat-cards">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="currentColor"/></svg>
                        </div>
                        <div class="stat-body">
                            <p class="stat-label">Plays</p>
                            <p class="stat-value" id="stat-plays">—</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
                        </div>
                        <div class="stat-body">
                            <p class="stat-label">Hours played</p>
                            <p class="stat-value" id="stat-hours">—</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.3" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M4.5 20c1-3.8 4-5.8 7.5-5.8s6.5 2 7.5 5.8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
                        </div>
                        <div class="stat-body">
                            <p class="stat-label">Artists</p>
                            <p class="stat-value" id="stat-artists">—</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="12" cy="12" r="2.3" fill="currentColor"/></svg>
                        </div>
                        <div class="stat-body">
                            <p class="stat-label">Albums</p>
                            <p class="stat-value" id="stat-albums">—</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg viewBox="0 0 24 24"><path d="M9 18V6.4l10-2v10.6M9 18a2.6 2.6 0 1 1-5.2 0A2.6 2.6 0 0 1 9 18Zm10-3a2.6 2.6 0 1 1-5.2 0 2.6 2.6 0 0 1 5.2 0Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
                        </div>
                        <div class="stat-body">
                            <p class="stat-label">Tracks</p>
                            <p class="stat-value" id="stat-tracks">—</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="top-lists">
                <div class="card top-list-card">
                    <h3 class="card-name">Top Artists</h3>
                    <div class="list-featured" id="top-artists-featured"></div>
                    <ol class="ranked-list" id="top-artists"></ol>
                </div>
                <div class="card top-list-card">
                    <h3 class="card-name">Top Albums</h3>
                    <div class="list-featured" id="top-albums-featured"></div>
                    <ol class="ranked-list" id="top-albums"></ol>
                </div>
                <div class="card top-list-card">
                    <h3 class="card-name">Top Tracks</h3>
                    <div class="list-featured" id="top-tracks-featured"></div>
                    <ol class="ranked-list" id="top-tracks"></ol>
                </div>
            </section>

            <section class="card">
                <div class="card-expandable">
                    <h3 class="card-name">Recently played</h3>
                    <a class="card-expand" href="recent.html">See more &gt;</a>
                </div>
                <div id="recent-strip"></div>
            </section>

            <section id="graphs">
                <div class="graph-card card">
                    <div>
                        <h3 class="card-name">Daily frequency</h3>
                        <p class="card-desc">Your activity during a day</p>
                    </div>
                    <canvas id="graph-hour"><canvas/>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
