<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Track</title>
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/image-header.css">
	<link rel="stylesheet" href="css/content-stats.css">
	<script type="module" src="js/redirect-login.js" defer></script>
	<script type="module" src="js/track.js" defer></script>
	<script type="module" src="js/load-sidebar.js" defer></script>
</head>
<body>
    <div id="layout">
        <main>
            <section id="img-header" class="card">
                <img class="img" src="">
                <div class="content">
                    <h1 class="title"></h1>
                    <div class="artists link-list"></div>
                    <div class="album link-list"></div>
                    <div class="content-stats"></div>
                </div>
            </section>
            <section id="graph">
                <div class="graph-card card">
                    <div class="card-expandable">
                        <div>
                            <h3 class="card-name">Track activity</h3>
                        </div>
                        <div>
                            <form class="ts-row graph-type-selection">
                                <span>
                                    <label>All time</label>
                                    <input class="graph-type-time" type="radio" name="size" value="small" checked>
                                </span>

                                <span>
                                    <label>Daily</label>
                                    <input class="graph-type-daily" type="radio" name="size" value="medium">
                                </span>

                                <span>
                                    <label>Weekly</label>
                                    <input class="graph-type-weekly" type="radio" name="size" value="large">
                                </span>
                            </form>
                        </div>
                    </div>
                    <canvas><canvas/>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
