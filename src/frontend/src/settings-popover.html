<link rel="stylesheet" href="css/settings.css">
<div id="settings" class="card" popover>
    <h1 class="card-name">Settings</h1>
    <p class="card-desc">Manage your session</p>

    <h1 class="setting-desc">Artist roles</h1>
    <div class="ts-row space-between">
        <span>
            <label>Artist</label>
            <input id="artist-type-artist" type="checkbox">
        </span>

        <span>
            <label>Album</label>
            <input id="artist-type-album" type="checkbox">
        </span>

        <span>
            <label>Composer</label>
            <input id="artist-type-composer" type="checkbox">
        </span>
    </div>

    <br>

    <h1 class="setting-desc">Timezone</h1>
    <div class="timezone">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M3.7 12h16.6M12 3.7c2.4 2.3 3.7 5.3 3.7 8.3s-1.3 6-3.7 8.3c-2.4-2.3-3.7-5.3-3.7-8.3S9.6 6 12 3.7Z" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
        <select></select>
    </div>

    <br>

    <h1 class="setting-desc">Account</h1>
    <div class="settings-actions">
        <button type="button" id="logout-btn" class="default-button">Log out</button>
    </div>

</div>
