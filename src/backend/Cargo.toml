[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bitflags = "2.13.2"
bytes = "1.12.2"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.8", features = ["derive"] }
isolang = "2.4.0"
jsonwebtoken = "12.0.0"
md5 = "0.8.1"
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }
uuid = { version = "1.29.3", features = ["serde", "v4"] }
