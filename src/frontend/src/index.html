<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module">
        import {Api} from "./js/api.js"

        let token_in_url = new URLSearchParams(window.location.search).get("with-token");
        if (token_in_url) {
            localStorage.setItem("token", token_in_url)
        }

        let api = new Api

        let is_logged_in = await api.auth_check()

        if (is_logged_in) {
            window.location.replace("dashboard.html")
        } else {
            window.location.replace("login.html")
        }
    </script>
    <title>Index</title>
</head>
<body>

</body>
</html>
