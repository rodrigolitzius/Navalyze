<div id="settings" class="card" popover>
    <h1 class="card-name">Settings</h1>
    <p class="card-desc">Manage your session</p>

    <h1 class="setting-desc">Artist roles</h1>
    <div class="ts-row space-between">
        <span>
            <label>Artist</label>
            <input id="artist-type-artist" type="checkbox">
        </span>

        <span>
            <label>Album</label>
            <input id="artist-type-album" type="checkbox">
        </span>

        <span>
            <label>Composer</label>
            <input id="artist-type-composer" type="checkbox">
        </span>
    </div>

    <br>

    <h1 class="setting-desc">Account</h1>
    <div class="settings-actions">
        <button type="button" id="logout-btn" class="default-button">Log out</button>
    </div>
</div>
