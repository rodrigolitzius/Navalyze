<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Artist</title>
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/artist.css">
	<script type="module" src="js/redirect-login.js" defer></script>
	<script type="module" src="js/artist.js" defer></script>
	<script type="module" src="js/load-sidebar.js" defer></script>
</head>
<body>
    <div id="layout">
        <main>
            <section id="image-header" class="card"></section>
            <section class="card">
                <h1 class="card-name">Albums</h1>
                <div id="albums"></div>
            </section>
            <section id="graph">
                <div class="graph-card card">
                    <div>
                        <h3 class="card-name">Scrobble history</h3>
                        <p class="card-desc">How much you played this artist across time</p>
                    </div>
                    <canvas id="graph-artist"><canvas/>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
