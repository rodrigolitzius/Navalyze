<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Graphs</title>
	<link rel="stylesheet" href="css/base.css">
	<link rel="stylesheet" href="css/graphs.css">
	<script type="module" src="js/redirect-login.js" defer></script>
	<script type="module" src="js/graphs.js" defer></script>
	<script type="module" src="js/load-sidebar.js" defer></script>
</head>
<body>
    <div id="layout">
        <main>
            <section class="card" id="languages">
                <div class="card-expandable">
                    <div>
                        <h1 class="card-name">Languages</h1>
                        <p class="card-desc">What languages you listen to the most</p>
                    </div>
                    <div>
                        <form class="ts-row graph-type-selection">
                            <span>
                                <label>All time</label>
                                <input class="graph-type-time" type="radio" name="size" value="small" checked>
                            </span>

                            <span>
                                <label>Daily</label>
                                <input class="graph-type-daily" type="radio" name="size" value="medium">
                            </span>

                            <span>
                                <label>Weekly</label>
                                <input class="graph-type-weekly" type="radio" name="size" value="large">
                            </span>
                        </form>
                    </div>
                </div>
                <div class="graph-div">
                    <span class="doughnut"><canvas></canvas></span>
                    <span class="line"><canvas></canvas></span>
                </div>
            </section>
            <section class="card" id="genres">
                <div class="card-expandable">
                    <div>
                        <h1 class="card-name">Genres</h1>
                        <p class="card-desc">What genres you listen to the most</p>
                    </div>
                    <div>
                        <form class="ts-row graph-type-selection">
                            <span>
                                <label>All time</label>
                                <input class="graph-type-time" type="radio" name="size" value="small" checked>
                            </span>

                            <span>
                                <label>Daily</label>
                                <input class="graph-type-daily" type="radio" name="size" value="medium">
                            </span>

                            <span>
                                <label>Weekly</label>
                                <input class="graph-type-weekly" type="radio" name="size" value="large">
                            </span>
                        </form>
                    </div>
                </div>
                <div class="graph-div">
                    <span class="line"><canvas></canvas></span>
                    <span class="doughnut"><canvas></canvas></span>
                </div>
            </section>
            <section class="card" id="release-types">
                <div class="card-expandable">
                    <div>
                        <h1 class="card-name">Release Types</h1>
                        <p class="card-desc">What release types you listen to the most</p>
                    </div>
                    <div>
                        <form class="ts-row graph-type-selection">
                            <span>
                                <label>All time</label>
                                <input class="graph-type-time" type="radio" name="size" value="small" checked>
                            </span>

                            <span>
                                <label>Daily</label>
                                <input class="graph-type-daily" type="radio" name="size" value="medium">
                            </span>

                            <span>
                                <label>Weekly</label>
                                <input class="graph-type-weekly" type="radio" name="size" value="large">
                            </span>
                        </form>
                    </div>
                </div>
                <div class="graph-div">
                    <span class="doughnut"><canvas></canvas></span>
                    <span class="line"><canvas></canvas></span>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
