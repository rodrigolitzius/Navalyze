<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/login.css">
    <script type="module" src="js/login.js" defer></script>
</head>
<body>
    <div class="login-card">
        <h1>Login</h1>

        <form id="login-form">
            <div class="form-group">
                <label for="navidrome-url">Navidrome URL</label>
                <input type="url" id="navidrome-url" placeholder="http://seulocalhost.com" required>
            </div>

            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="Digite seu nome de usuário" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <label for="timezone">Fuso horário</label>
                <input type="text" id="timezone" placeholder="America/Sao_Paulo" required>
            </div>

            <button type="submit" id="login-btn">Entrar</button>
        </form>
    </div>
</body>
</html>
